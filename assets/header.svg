<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="mihailin — Minice, software studio. Voice-first desktop software, written in Rust.">
  <title>mihailin — Minice software studio</title>

  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="var(--violet)"/>
      <stop offset="0.62" stop-color="var(--violet)"/>
      <stop offset="1"   stop-color="var(--accent)"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent)"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    svg {
      --bg:#F7F6FB; --border:#E4E1F0; --fg:#141220;
      --muted:#6E6A85; --violet:#6C5CE0; --accent:#D9622F;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#0C0B13; --border:#1F1C2F; --fg:#F2F0FA;
        --muted:#8A85A3; --violet:#9C8CFF; --accent:#FF9E6B;
      }
    }

    .card    { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
    .eyebrow { font-family: var(--mono); font-size: 12.5px; font-weight: 600;
                letter-spacing: 3.4px; fill: var(--accent); }
    .mark    { font-family: var(--sans); font-size: 64px; font-weight: 800;
                letter-spacing: -2.6px; fill: var(--fg); }
    .sub     { font-family: var(--sans); font-size: 16px; font-weight: 400;
                letter-spacing: 0.1px; fill: var(--muted); }
    .base    { stroke: var(--muted); stroke-width: 1; opacity: .18; }

    .b { fill: url(#wave); transform-box: fill-box; transform-origin: center;
         animation-name: talk; animation-timing-function: cubic-bezier(.45,.05,.35,1);
         animation-iteration-count: infinite; animation-direction: alternate; }
    @keyframes talk {
      0%   { transform: scaleY(.34); }
      45%  { transform: scaleY(1);   }
      100% { transform: scaleY(.58); }
    }
    @media (prefers-reduced-motion: reduce) {
      .b { animation: none; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="999" height="239" rx="18"/>

  <text class="eyebrow" x="64" y="76">MINICE — SOFTWARE STUDIO</text>
  <rect x="64" y="90" width="150" height="2" rx="1" fill="url(#rule)"/>

  <text class="mark" x="60" y="156">mihailin</text>
  <text class="sub"  x="64" y="192">Voice-first desktop software, written in Rust.</text>

